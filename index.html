<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豐譽營造 - 內部稽核自動化公文系統 V3.7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        #toast { visibility: hidden; opacity: 0; transform: translateY(-20px); transition: all 0.3s; }
        #toast.show { visibility: visible; opacity: 1; transform: translateY(0); }
        .spinner { border: 4px solid rgba(0,0,0,0.1); border-left-color: #b91c1c; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .report-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 11pt; }
        .report-table th, .report-table td { border: 1px solid #000000; padding: 8px; vertical-align: top; text-align: left; line-height: 1.5; }
        .report-table th { background-color: #f2f2f2; font-weight: bold; }
        .page-break { page-break-before: always; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">
    <header class="bg-slate-800 text-white shadow-md relative z-20">
        <div class="max-w-screen-2xl mx-auto px-6 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-layer-group text-2xl text-red-500"></i>
                <h1 class="text-xl font-bold tracking-wider">豐譽營造 <span class="text-slate-400 mx-2">|</span> 內部稽核自動化公文系統 <span class="text-xs bg-red-600 px-2 py-0.5 rounded ml-2 shadow-sm">V3.7 異常防禦版 (NCR/CAR)</span></h1>
            </div>
            <div class="text-sm bg-slate-700 text-slate-200 px-3 py-1 rounded-full border border-slate-600">
                <i class="fa-solid fa-shield-halved mr-1"></i> 動態矯正與預防引擎
            </div>
        </div>
    </header>

    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-red-600 text-white font-medium px-6 py-3 rounded shadow-lg z-50 flex items-center">
        <i class="fa-solid fa-circle-exclamation mr-3 text-lg"></i>
        <span id="toast-message">提示訊息</span>
    </div>

    <main class="flex-grow flex overflow-hidden max-w-screen-2xl mx-auto w-full p-4 gap-4">
        <div class="w-80 flex flex-col gap-4 overflow-y-auto pr-2 flex-shrink-0 pb-10">
            <div class="glass-panel p-5 rounded-xl border-t-4 border-t-red-600 flex flex-col">
                
                <div class="mb-5 relative z-20 bg-slate-50 p-3 rounded-lg border border-slate-200">
                    <h2 class="text-sm font-bold mb-2 text-slate-800"><i class="fa-regular fa-calendar-check mr-1 text-slate-500"></i> 稽核月份設定</h2>
                    <select id="audit-month" class="w-full bg-white border border-slate-300 text-slate-700 text-sm rounded focus:ring-red-500 focus:border-red-500 block p-2 font-medium cursor-pointer shadow-sm">
                        <option value="04">4月份稽核報告</option>
                        <option value="05">5月份稽核報告</option>
                        <option value="06">6月份稽核報告</option>
                        <option value="07">7月份稽核報告</option>
                        <option value="08" selected>8月份稽核報告 (本期含CAR)</option>
                        <option value="09">9月份稽核報告</option>
                    </select>
                </div>

                <h2 class="text-sm font-bold mb-3 text-slate-800 border-b pb-2"><i class="fa-solid fa-users-gear mr-1 text-slate-500"></i> 稽核視角設定</h2>
                <div class="flex flex-col gap-2 mb-6 relative z-20">
                    <label class="flex items-center space-x-2 cursor-pointer group">
                        <input type="checkbox" id="role-engineer" class="form-checkbox text-red-600 rounded border-slate-300" checked>
                        <span class="text-sm text-slate-700 font-medium">現場工程師 (實務與防禦)</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer group">
                        <input type="checkbox" id="role-qa" class="form-checkbox text-red-600 rounded border-slate-300" checked>
                        <span class="text-sm text-slate-700 font-medium">品管工程師 (溯源與矯正)</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer group">
                        <input type="checkbox" id="role-director" class="form-checkbox text-red-600 rounded border-slate-300" checked>
                        <span class="text-sm text-slate-700 font-medium">工地主任 (管理與究責)</span>
                    </label>
                </div>

                <h2 class="text-sm font-bold mb-3 text-slate-800 border-b pb-2"><i class="fa-solid fa-folder-open mr-1 text-slate-500"></i> 專案品質文件庫</h2>
                
                <div class="mb-3 relative">
                    <h3 class="text-xs font-bold text-slate-600 mb-1 flex justify-between">
                        <span><i class="fa-solid fa-file-circle-check mr-1"></i> 自主檢查表 (主分析)</span>
                        <span class="bg-slate-200 text-slate-600 px-2 rounded-full text-[10px]" id="count-check">0</span>
                    </h3>
                    <div class="border-2 border-dashed border-slate-300 rounded-lg p-2 text-center hover:bg-slate-50 relative cursor-pointer">
                        <input type="file" id="file-check" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                        <p class="text-[11px] text-slate-500">匯入自檢表</p>
                    </div>
                    <div id="list-check" class="mt-1 space-y-1 max-h-24 overflow-y-auto relative z-30"></div>
                </div>

                <div class="mb-3 relative">
                    <h3 class="text-xs font-bold text-red-700 mb-1 flex justify-between">
                        <span><i class="fa-solid fa-triangle-exclamation mr-1"></i> 缺失單/矯正預防單 (NCR)</span>
                        <span class="bg-red-100 text-red-700 px-2 rounded-full text-[10px]" id="count-ncr">0</span>
                    </h3>
                    <div class="border-2 border-dashed border-red-300 bg-red-50 rounded-lg p-3 text-center hover:bg-red-100 relative cursor-pointer">
                        <input type="file" id="file-ncr" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                        <p class="text-[11px] text-red-600 font-bold">匯入 QA 缺失單 / CAR 報告<br>系統將自動立案追蹤</p>
                    </div>
                    <div id="list-ncr" class="mt-1 space-y-1 max-h-24 overflow-y-auto relative z-30"></div>
                </div>

                <div class="mb-3 relative">
                    <h3 class="text-xs font-bold text-slate-600 mb-1 flex justify-between">
                        <span><i class="fa-solid fa-book mr-1"></i> 施工日誌 & 簡報</span>
                        <span class="bg-slate-200 text-slate-600 px-2 rounded-full text-[10px]" id="count-log">0</span>
                    </h3>
                    <div class="border-2 border-dashed border-slate-300 rounded-lg p-2 text-center hover:bg-slate-50 relative cursor-pointer">
                        <input type="file" id="file-log" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                        <p class="text-[11px] text-slate-500">匯入交叉驗證文件</p>
                    </div>
                    <div id="list-log" class="mt-1 space-y-1 max-h-24 overflow-y-auto relative z-30"></div>
                </div>

                <button id="btn-analyze" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center shadow-md border border-slate-600 relative z-40 mt-2">
                    <i class="fa-solid fa-file-signature mr-2 text-red-400"></i> 生成正式稽核公文
                </button>
            </div>
        </div>

        <div class="flex-grow bg-slate-300 rounded-xl overflow-y-auto relative border border-slate-400 shadow-inner flex flex-col">
            <div class="bg-slate-100 p-2 border-b border-slate-300 flex justify-between items-center sticky top-0 z-10 shadow-sm">
                <span class="text-sm font-bold text-slate-600 ml-2"><i class="fa-regular fa-file-word mr-1"></i> 綜合稽核產出預覽 (A4)</span>
                <button id="btn-download" class="bg-red-700 hover:bg-red-800 text-white px-4 py-1.5 rounded text-sm font-medium hidden shadow-sm flex items-center">
                    <i class="fa-solid fa-file-arrow-down mr-2"></i> 匯出正式 Word 報表
                </button>
            </div>

            <div id="loading" class="absolute inset-0 bg-slate-200/95 z-20 hidden flex-col items-center justify-center backdrop-blur-sm">
                <div class="spinner mb-4"></div>
                <h3 class="text-lg font-bold text-slate-800">專案品質文檔深度解析中...</h3>
                <p class="text-sm text-slate-600 mt-2">正在交叉驗證自檢表數據，並檢索異常立案紀錄</p>
            </div>

            <div class="p-6 pb-20">
                <div id="empty-state" class="flex flex-col items-center justify-center h-full text-slate-400 mt-32">
                    <i class="fa-solid fa-shield-halved text-6xl mb-4 text-slate-300"></i>
                    <p class="text-lg font-medium text-slate-500">等待資料匯入與彙整</p>
                    <p class="text-sm mt-2">若本月有開立不合格品或矯正單，請務必上傳以利系統立案。</p>
                </div>
                <div id="report-content" class="bg-white p-12 shadow-lg mx-auto hidden" style="max-w: 21cm; min-height: 29.7cm; font-family: '標楷體', 'MingLiU', serif;">
                </div>
            </div>
        </div>
    </main>

    <script>
        const files = { log: [], check: [], ncr: [] };

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        function setupInput(type) {
            document.getElementById(`file-${type}`).addEventListener('change', (e) => {
                const newFiles = Array.from(e.target.files).map(f => ({ file: f, selected: true }));
                files[type] = [...files[type], ...newFiles];
                renderList(type);
                e.target.value = ''; 
            });
        }

        function toggleFile(type, index) {
            files[type][index].selected = !files[type][index].selected;
            renderList(type);
        }

        function removeFile(type, index) {
            files[type].splice(index, 1);
            renderList(type);
        }

        function renderList(type) {
            const container = document.getElementById(`list-${type}`);
            document.getElementById(`count-${type}`).innerText = files[type].length;
            container.innerHTML = files[type].map((item, i) => `
                <div class="flex items-center justify-between bg-white px-2 py-1.5 rounded border ${item.selected ? (type==='ncr'?'border-red-200 bg-red-50':'border-slate-200') : 'border-slate-200 opacity-50'} shadow-sm">
                    <div class="flex items-center space-x-2 overflow-hidden flex-grow">
                        <input type="checkbox" ${item.selected ? 'checked' : ''} onchange="toggleFile('${type}', ${i})" class="form-checkbox h-3.5 w-3.5 ${type==='ncr'?'text-red-600':'text-teal-600'} rounded">
                        <span class="text-[11px] truncate text-slate-700" title="${item.file.name}">${item.file.name}</span>
                    </div>
                    <button onclick="removeFile('${type}', ${i})" class="text-slate-400 hover:text-red-500 ml-2">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            `).join('');
        }

        setupInput('log'); setupInput('check'); setupInput('ncr');

        document.getElementById('btn-download').addEventListener('click', function() {
            const monthStr = document.getElementById('audit-month').value;
            const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>內部品質稽核成果報告</title><style>body { font-family: '標楷體', 'MingLiU', serif; }table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 11pt; }th, td { border: 1px solid #000000; padding: 8px; vertical-align: top; text-align: left; line-height: 1.5; }th { background-color: #f2f2f2; font-weight: bold; }h1 { font-size: 18pt; text-align: center; font-weight: bold; margin-bottom: 10px; }h2 { font-size: 16pt; text-align: center; font-weight: bold; margin-bottom: 20px; }h3 { font-size: 14pt; font-weight: bold; border-bottom: 1px solid #000; padding-bottom: 5px; margin-top: 20px; }p, li { font-size: 12pt; line-height: 1.5; }.text-center { text-align: center !important; }@page WordSection1 { size: 21cm 29.7cm; margin: 2cm 1.5cm; mso-paper-source: 0; }div.WordSection1 { page: WordSection1; }</style></head><body><div class='WordSection1'>";
            const footer = "</div></body></html>";
            const sourceHTML = document.getElementById("report-content").innerHTML;
            const blob = new Blob(['\ufeff', header + sourceHTML + footer], { type: 'application/msword' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `豐譽營造_115年${parseInt(monthStr)}月內部品質稽核報告_立案簽核版.doc`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        document.getElementById('btn-analyze').addEventListener('click', () => {
            const selectedChecks = files.check.filter(item => item.selected);
            const selectedNcrs = files.ncr.filter(item => item.selected);
            const selectedLogs = files.log.filter(item => item.selected);
            
            const monthStr = document.getElementById('audit-month').value;
            const monthNum = parseInt(monthStr);

            let prevMonthNum = monthNum - 1;
            let yearStrPrev = "115";
            if (prevMonthNum === 0) { prevMonthNum = 12; yearStrPrev = "114"; }
            const prevMonthStr = prevMonthNum.toString().padStart(2, '0');

            if (selectedChecks.length === 0 && selectedNcrs.length === 0) {
                showToast('請至少上傳一份「自主檢查表」或「缺失單」！');
                return;
            }

            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('report-content').classList.add('hidden');
            document.getElementById('btn-download').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('loading').classList.add('flex');

            const parseFileName = (filename) => {
                let dateStr = `115.${monthStr}.15`; 
                const dateMatch = filename.match(/115\d{4}/);
                if (dateMatch) dateStr = `115.${dateMatch[0].substring(3, 5)}.${dateMatch[0].substring(5, 7)}`;
                let formNo = `EA${monthStr}-001`;
                const noMatch = filename.match(/[E][A-Z]\d{2}-\d{3}/i);
                if (noMatch) formNo = noMatch[0].toUpperCase();

                let title = filename.replace('.pdf', '').replace('.jpg', '');
                let criteria = "依品質計畫書辦理現場查證";
                let evidence = "實測量化數值已填寫";

                if (filename.includes("墊塊") || filename.includes("QA-009")) {
                    criteria = "查核是否預留鋼筋保護層及放置水泥墊塊";
                    evidence = "缺失改善：已派員補放墊塊完成";
                } else if (filename.includes("帽筋") || filename.includes("QA-008")) {
                    criteria = "查核壓梁箍筋綁紮及帽筋放置";
                    evidence = "缺失改善：已補放帽筋並綁紮完成";
                } else if (filename.includes("間距") || filename.includes("QA-005")) {
                    criteria = "查核箍筋間距是否符合 #4@15cm";
                    evidence = "缺失改善：已調整至設計間距並加固";
                } else if (filename.includes("鋼筋")) {
                    criteria = "查核主筋支數、箍筋間距及搭接長度 ≧199cm";
                    evidence = "主筋/箍筋間距完整且無扭曲，搭接合格";
                } else if (filename.includes("混凝土") || filename.includes("預拌")) {
                    criteria = "查驗坍度、氯離子含量及抗壓試體";
                    evidence = "實測坍度與氯離子合格，試體已取樣";
                } else {
                    criteria = "查核施作尺寸、高程及定位誤差";
                    evidence = "實測各項數值控制於規範容許範圍內";
                }
                return { date: dateStr, no: formNo, title: title, criteria: criteria, evidence: evidence };
            };

            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('loading').classList.remove('flex');
                
                // 動態判定是否有 NCR/CAR 立案
                let hasNCR = selectedNcrs.length > 0 || selectedChecks.some(f => f.file.name.includes("QA-") || f.file.name.includes("缺失"));
                
                renderReport({ 
                    selectedChecks: selectedChecks, 
                    selectedLogs: selectedLogs,
                    selectedNcrs: selectedNcrs,
                    monthStr: monthStr, monthNum: monthNum,
                    prevMonthStr: prevMonthStr, yearStrPrev: yearStrPrev,
                    hasNCR: hasNCR,
                    parseFileName: parseFileName 
                });
            }, 2000);
        });

        function renderReport(data) {
            const m = data.monthNum;
            const logCount = data.selectedLogs.length;

            // NCR 動態注入邏輯 (真實對齊 SKM_C558 矯正與預防措施單)
            let ncrTable4HTML = `<tr><td style="text-align: center; padding: 40px 0;" colspan="4">本期無不符事項</td></tr><tr><td colspan="4">備註：☑ 本次稽核結果均符合規範，無開立改正行動通知書。</td></tr>`;
            let ncrTable5HTML = `<tr><td style="text-align: center; padding: 20px 0;" colspan="6">無立案紀錄</td></tr>`;
            let ncrReviewText = "本期抽查自主檢查表，皆已落實量化數據填寫，無須開立不合格單。";
            let ncrInsightText = "";

            if (data.hasNCR) {
                ncrTable4HTML = `
                    <tr>
                        <td style="padding: 10px;"><b>不符事項：</b><br>擋土排樁工程(預壘樁)壓梁鋼筋綁紮屢次未依圖說施工。同性質缺失(箍筋間距過大、帽筋未放、未放墊塊)累計發生達3次以上，屬系統性異常。</td>
                        <td style="padding: 10px;"><b>矯正措施：</b><br>現場已立即派員將帽筋補放、水泥墊塊置入，並將鋼筋間距調整補綁完成。</td>
                        <td style="padding: 10px;"><b>改善結果：</b><br>經品管工程師現場查核複驗，缺失已全數改善完畢，符合設計規範。</td>
                        <td style="padding: 10px;"><b>預防措施：</b><br>1. 開檢討會加強宣導圖說重點(#4@15cm)。<br>2. 提升現場工程師巡視頻率，內部自檢合格方可報驗。</td>
                    </tr>
                    <tr><td colspan="4">備註：☑ 本單依據《品質計畫書第9章 矯正與預防措施》開立並結案。</td></tr>
                `;
                ncrTable5HTML = `
                    <tr>
                        <td style="text-align: center;">CAR-11508-01</td>
                        <td style="text-align: center;">115.${data.monthStr}.31</td>
                        <td style="text-align: center;">內部稽核 (品質異常)</td>
                        <td style="text-align: center;">世詮營造 (排樁工程)</td>
                        <td style="text-align: center;">115.${data.monthStr}.31</td>
                        <td style="text-align: center; color: green; font-weight: bold;">☑ 115.${data.monthStr}.31 結案</td>
                    </tr>
                `;
                ncrReviewText = "本期經查核發現排樁鋼筋綁紮有屢次未依圖說施工之情況，已正式開立「矯正與預防措施通知單」，要求協力廠商檢討並落實預防對策。";
                ncrInsightText = `【異常防堵與糾正】：針對下包廠商（世詮營造）壓梁鋼筋綁紮屢次發生漏放帽筋與墊塊之情事，品管小組已依規定開立異常單，並要求加強現場巡視，自檢合格方可報驗，防堵系統性缺失蔓延。\n`;
            }

            let html = `
                <h1 style="font-size: 18pt; text-align: center; font-weight: bold; margin-bottom: 10px;">豐譽營造股份有限公司</h1>
                <h2 style="font-size: 16pt; text-align: center; font-weight: bold; margin-bottom: 20px;">衛生福利部防疫中心興建工程 115年${m}月份內部品質稽核成果報告</h2>
                <p>說明：本報告依據「內部品質稽核程序」編製，針對 115 年 ${m} 月份施工日誌、自檢表與缺失紀錄進行深度交叉稽核，確保現場落實專案品質管理計畫書要求。</p>
                
                <h3>一、 表 10.5-1 內部品質稽核通知單</h3>
                <table class="report-table">
                    <tr><th width="20%">受稽核單位</th><td width="30%">工務所、施工組、品管組</td><th width="20%">通知日期</th><td width="30%">115 年 ${data.monthStr} 月 12 日</td></tr>
                    <tr><th>受稽核日期</th><td colspan="3">${data.yearStrPrev} 年 ${data.prevMonthStr} 月 25 日 至 115 年 ${data.monthStr} 月 24 日</td></tr>
