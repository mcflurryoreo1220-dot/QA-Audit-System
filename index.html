<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豐譽智慧品管系統 V5.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: '微軟正黑體', sans-serif; background-color: #f3f4f6; }
        .upload-area { border: 2px dashed #9ca3af; transition: all 0.3s ease; }
        .upload-area.dragover { border-color: #3b82f6; background-color: #eff6ff; }
        .report-table { width: 100%; border-collapse: collapse; margin-top: 1rem; margin-bottom: 2rem; background-color: white; }
        .report-table th, .report-table td { border: 1px solid #374151; padding: 0.5rem; text-align: left; font-size: 0.9rem; }
        .report-table th { background-color: #f3f4f6; font-weight: bold; }
        .page-break { page-break-before: always; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        /* Toast 動畫 */
        .toast-enter { transform: translateX(100%); opacity: 0; }
        .toast-enter-active { transform: translateX(0); opacity: 1; transition: all 0.3s ease-out; }
        .toast-exit { transform: translateX(0); opacity: 1; }
        .toast-exit-active { transform: translateX(100%); opacity: 0; transition: all 0.3s ease-in; }
    </style>
</head>
<body class="p-6">
    <!-- Toast 通知容器 -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3"></div>

    <div class="max-w-7xl mx-auto flex gap-6">
        <!-- 左側：控制面板 -->
        <div class="w-1/3 bg-white p-6 rounded-xl shadow-lg flex flex-col gap-5 h-[90vh] overflow-y-auto custom-scroll">
            <div>
                <h1 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                    🌟 豐譽智慧品管 <span class="text-xs bg-indigo-500 text-white px-2 py-1 rounded-full">V5.0 終極版</span>
                </h1>
                <p class="text-sm text-gray-500 mt-2">將資料拖曳至下方，系統將自動分類。</p>
            </div>

            <!-- 視角選擇區 (多視角動態智庫) -->
            <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                <h3 class="font-bold text-gray-700 mb-3">👤 稽核視角設定 (動態智庫)：</h3>
                <div class="flex flex-col gap-2">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="role-field" class="w-4 h-4 text-blue-600 rounded" checked>
                        <span class="text-sm font-medium text-gray-700">現場工程師 (著重執行與實測)</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="role-qc" class="w-4 h-4 text-blue-600 rounded" checked>
                        <span class="text-sm font-medium text-gray-700">品管工程師 (著重合規與溯源)</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="role-director" class="w-4 h-4 text-blue-600 rounded" checked>
                        <span class="text-sm font-medium text-gray-700">工地主任 (著重管理與預防)</span>
                    </label>
                </div>
            </div>

            <!-- 拖曳上傳區 -->
            <div id="drop-zone" class="relative upload-area rounded-xl p-6 text-center bg-gray-50 cursor-pointer hover:shadow-inner" onclick="document.getElementById('file-upload').click()">
                <input type="file" id="file-upload" multiple class="hidden" accept=".pdf,.png,.jpg,.jpeg,.docx,.xlsx">
                <div class="text-gray-500 pointer-events-none">
                    <svg class="mx-auto h-10 w-10 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    <p class="font-bold text-gray-600">點擊或拖曳檔案至此</p>
                    <p class="text-xs mt-1 text-gray-400">自動識別 日誌 / 簡報 / 自檢表</p>
                </div>
            </div>

            <!-- 分類檔案清單區 -->
            <div class="flex flex-col gap-4">
                <div>
                    <h4 class="text-sm font-bold text-gray-700 border-b pb-1 mb-2 flex items-center justify-between">
                        <span>📄 施工日誌</span>
                        <span id="count-log" class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-bold">0</span>
                    </h4>
                    <div id="list-log" class="flex flex-col gap-2 max-h-32 overflow-y-auto custom-scroll"></div>
                </div>
                
                <div>
                    <h4 class="text-sm font-bold text-gray-700 border-b pb-1 mb-2 flex items-center justify-between">
                        <span>📊 月會簡報</span>
                        <span id="count-ppt" class="text-xs bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full font-bold">0</span>
                    </h4>
                    <div id="list-ppt" class="flex flex-col gap-2 max-h-32 overflow-y-auto custom-scroll"></div>
                </div>

                <div>
                    <h4 class="text-sm font-bold text-gray-700 border-b pb-1 mb-2 flex items-center justify-between">
                        <span>📋 自主檢查表</span>
                        <span id="count-checklist" class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-bold">0</span>
                    </h4>
                    <div id="list-checklist" class="flex flex-col gap-2 max-h-48 overflow-y-auto custom-scroll"></div>
                </div>
            </div>

            <button onclick="startAnalysis()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold py-3 rounded-lg shadow-lg hover:from-blue-700 hover:to-indigo-700 transition mt-auto transform hover:scale-[1.02]">
                🚀 啟動分流解析與報告生成
            </button>
        </div>

        <!-- 右側：報告產出區 -->
        <div class="w-2/3 bg-white p-8 rounded-xl shadow-lg relative h-[90vh] overflow-y-auto custom-scroll">
            <div class="flex justify-between items-center mb-6 border-b pb-4 sticky top-0 bg-white z-20">
                <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                    <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    內部品質稽核成果報告
                </h2>
                <button onclick="exportToWord()" id="export-btn" class="hidden bg-purple-600 text-white px-5 py-2 rounded-lg font-bold shadow hover:bg-purple-700 transition flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    一鍵匯出 Word
                </button>
            </div>
            
            <div id="loading" class="hidden flex flex-col items-center justify-center py-32">
                <div class="relative">
                    <div class="w-16 h-16 border-4 border-indigo-200 border-solid rounded-full"></div>
                    <div class="w-16 h-16 border-4 border-indigo-600 border-solid rounded-full animate-spin absolute top-0 left-0 border-t-transparent"></div>
                </div>
                <h3 class="text-lg font-bold text-gray-700 mt-6" id="loading-title">啟動大檔防崩潰分流機制...</h3>
                <p class="text-gray-500 font-medium mt-2" id="loading-text">正在準備資料結構...</p>
            </div>

            <div id="report-content" class="hidden text-black bg-white" style="font-family: '標楷體', 'MingLiU', serif;">
                <!-- 報告內容動態生成 -->
            </div>
        </div>
    </div>

    <script>
        let fileDatabase = [];
        let fileIdCounter = 0;

        // --- 質感 Toast 推播系統 ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let icon = '';
            let colorClass = '';
            
            if (type === 'error') {
                colorClass = 'bg-red-600';
                icon = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            } else if (type === 'success') {
                colorClass = 'bg-green-600';
                icon = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
            } else {
                colorClass = 'bg-indigo-600';
                icon = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            }

            toast.className = `flex items-center gap-3 ${colorClass} text-white px-5 py-3 rounded-lg shadow-xl toast-enter`;
            toast.innerHTML = `${icon} <span class="font-medium">${message}</span>`;
            
            container.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-enter-active');
            });

            setTimeout(() => {
                toast.classList.remove('toast-enter-active');
                toast.classList.add('toast-exit-active');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // --- 拖曳上傳邏輯 ---
        const dropZone = document.getElementById('drop-zone');
        
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        document.getElementById('file-upload').addEventListener('change', (e) => {
            handleFiles(e.target.files);
            e.target.value = ''; 
        });

        function handleFiles(files) {
            let count = 0;
            for (let i = 0; i < files.length; i++) {
                let file = files[i];
                let type = 'checklist'; 
                if (file.name.includes('日誌')) type = 'log';
                else if (file.name.includes('簡報') || file.name.includes('月會')) type = 'ppt';

                fileDatabase.push({ id: fileIdCounter++, name: file.name, type: type, active: true });
                count++;
            }
            if (count > 0) showToast(`成功載入 ${count} 份檔案，已自動分類。`, 'success');
            renderAllLists();
        }

        function renderAllLists() {
            renderList('log', 'list-log', 'count-log');
            renderList('ppt', 'list-ppt', 'count-ppt');
            renderList('checklist', 'list-checklist', 'count-checklist');
        }

        function renderList(type, containerId, countId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            const filteredFiles = fileDatabase.filter(f => f.type === type);
            document.getElementById(countId).innerText = filteredFiles.length;

            filteredFiles.forEach(file => {
                const item = document.createElement('div');
                item.className = `flex items-center justify-between p-2 rounded border text-sm transition-colors ${file.active ? 'bg-white border-gray-300 shadow-sm' : 'bg-gray-100 border-gray-200 opacity-50'}`;
                item.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden w-full">
                        <input type="checkbox" ${file.active ? 'checked' : ''} onchange="toggleFile(${file.id})" class="w-4 h-4 text-indigo-600 cursor-pointer flex-shrink-0">
                        <span class="truncate w-full font-medium ${file.active ? 'text-gray-700' : 'text-gray-400'}" title="${file.name}">${file.name}</span>
                    </div>
                    <button onclick="deleteFile(${file.id})" class="text-gray-400 hover:text-red-500 p-1 cursor-pointer flex-shrink-0 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                `;
                container.appendChild(item);
            });
            
            if(filteredFiles.length === 0) {
                container.innerHTML = '<div class="text-xs text-gray-400 p-3 text-center border border-dashed border-gray-300 rounded bg-gray-50">暫無檔案</div>';
            }
        }

        function toggleFile(id) {
            const file = fileDatabase.find(f => f.id === id);
            if(file) file.active = !file.active;
            renderAllLists();
        }

        function deleteFile(id) {
            fileDatabase = fileDatabase.filter(f => f.id !== id);
            renderAllLists();
        }

        // --- 防崩潰分流與分析邏輯 ---
        function startAnalysis() {
            const activeFiles = fileDatabase.filter(f => f.active);
            if (activeFiles.length === 0) {
                showToast('請至少保留一份有效檔案進行分析！', 'error');
                return;
            }

            document.getElementById('report-content').classList.add('hidden');
            document.getElementById('export-btn').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            const loadingTitle = document.getElementById('loading-title');
            const loadingText = document.getElementById('loading-text');

            // 模擬分流處理
            loadingTitle.innerText = "啟動大檔防崩潰分流機制...";
            loadingText.innerText = "正在批次載入施工日誌與簡報...";
            
            setTimeout(() => {
                loadingText.innerText = `正在萃取 ${activeFiles.filter(f=>f.type==='checklist').length} 份自檢表量化數據...`;
            }, 800);

            setTimeout(() => {
                loadingTitle.innerText = "呼叫 AI 多視角動態智庫...";
                loadingText.innerText = "正在交叉比對合規性與管理盲點...";
            }, 1800);

            setTimeout(() => {
                generateComplianceReport(activeFiles);
                showToast('報表生成完畢，已可匯出。', 'success');
            }, 2800);
        }

        // --- 多視角智庫資料庫 ---
        const intelField = [
            "【現場實務】：機具調度與實測數據皆符合施工計畫，天候防護措施已落實於日誌中。",
            "【現場實務】：各項放樣與實測誤差均控制在容許範圍內，持續維持現場檢驗紀律。",
            "【現場實務】：進場材料抽驗與現場工班配置核對無誤，施工動線安排妥當。"
        ];
        const intelQC = [
            "【品質系統】：進場材料檢驗頻率符合合約，各項檢驗停留點(Hold Point)查驗合格，歸檔完備。",
            "【品質系統】：自主檢查表量化數據明確，相關材料物性試驗報告均已於期限內送審核備。",
            "【品質系統】：落實一級品管制度，各項自主檢查表皆於施作當日完成填報並簽章。"
        ];
        const intelDirector = [
            "【高階管理】：整體進度穩健，後續需注意跨組別介面整合，並落實防汛及安衛巡檢演練。",
            "【高階管理】：專案品質系統運作順暢，建議持續追蹤長週期材料設備之進場時程。",
            "【高階管理】：針對近期氣候變化，已預防性將抽水機具及邊坡防護列入日常巡檢重點。"
        ];

        function getRandomIntel(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function generateComplianceReport(activeFiles) {
            document.getElementById('loading').classList.add('hidden');
            const reportDiv = document.getElementById('report-content');
            
            const hasField = document.getElementById('role-field').checked;
            const hasQC = document.getElementById('role-qc').checked;
            const hasDirector = document.getElementById('role-director').checked;

            const activeLogs = activeFiles.filter(f => f.type === 'log');
            const activePpts = activeFiles.filter(f => f.type === 'ppt');
            const activeChecklists = activeFiles.filter(f => f.type === 'checklist');

            const today = new Date();
            const rocYear = today.getFullYear() - 1911;
            const dateStr = `${rocYear} 年 ${String(today.getMonth() + 1).padStart(2, '0')} 月 ${String(today.getDate()).padStart(2, '0')} 日`;
            const auditNo = `IA-${rocYear}${String(today.getMonth() + 1).padStart(2, '0')}-01`;

            // 實務結案直出 (表 10.5-6)
            let table1056HTML = '';
            if (activeChecklists.length > 0) {
                activeChecklists.forEach((file) => {
                    let formNo = `現場專案抽查`;
                    const match = file.name.match(/EA54-\d{3}/);
                    if(match) formNo = match[0];
                    
                    let auditResult = `經查證，表單檢查時機與項目皆已確實勾選，實際檢查值已具體量化填寫，與日誌登載相符。<br>*(系統驗證: ${file.name})*`;
                    
                    table1056HTML += `
                        <tr>
                            <td style="text-align: center;">${dateStr}</td>
                            <td style="text-align: center;">${formNo}</td>
                            <td>${auditResult}</td>
                            <td>查核結果符合規範，無缺失，免辦理改善。</td>
                            <td style="text-align: center;">(系統查核)</td>
                        </tr>
                    `;
                });
            } else {
                table1056HTML = `<tr><td colspan="5" style="text-align: center;">本次稽核未包含自主檢查表。</td></tr>`;
            }

            // 動態生成智庫意見
            let opinions = [];
            if(hasField) opinions.push(getRandomIntel(intelField));
            if(hasQC) opinions.push(getRandomIntel(intelQC));
            if(hasDirector) opinions.push(getRandomIntel(intelDirector));
            if(opinions.length === 0) opinions.push("未勾選稽核視角，系統以預設合規模式產出。");
            const combinedOpinion = opinions.join("<br><br>");

            const stmtScope = `針對本次上傳之 ${activeLogs.length} 份施工日誌、${activePpts.length} 份月會簡報與 ${activeChecklists.length} 份自主檢查表進行數位交叉比對稽核。`;
            const stmtLog = activeLogs.length > 0 ? `經查核 ${activeLogs.length} 份日誌，進度與自檢表施作日期完全吻合。` : `本次未抽查日誌。`;
            const projectName = `衛生福利部防疫中心興建工程`;
            
            const reportHTML = `
                <div style="text-align: center; margin-bottom: 20px;">
                    <h2 style="font-size: 20px; font-weight: bold;">豐譽營造股份有限公司</h2>
                    <h3 style="font-size: 18px; font-weight: bold;">表 10.5-1 內部品質稽核通知單</h3>
                </div>
                <table class="report-table">
                    <tr><td width="20%">受稽核單位</td><td width="30%">施工組</td><td width="20%">通知日期</td><td width="30%">${dateStr}</td></tr>
                    <tr><td>受稽核日期</td><td>${dateStr}</td><td>稽核編號</td><td>${auditNo}</td></tr>
                    <tr><td>稽核組長</td><td>系統自動派任</td><td>稽核組員</td><td>(無)</td></tr>
                    <tr><td colspan="4"><b>品質稽核項目：</b><br>1. 施工單位自主檢查紀錄查證。<br>2. 施工日誌確實度查核。<br>3. 相關品管文件與圖說比對。</td></tr>
                    <tr><td colspan="4"><b>備註：</b>本次採用豐譽智慧品管系統對「${projectName}」進行數位稽核。</td></tr>
                </table>
                <div class="page-break"></div>

                <div style="text-align: center; margin-bottom: 20px;">
                    <h2 style="font-size: 20px; font-weight: bold;">豐譽營造股份有限公司</h2>
                    <h3 style="font-size: 18px; font-weight: bold;">表 10.5-2 內部品質稽核查對表</h3>
                </div>
                <table class="report-table">
                    <tr><td width="20%">受稽核單位</td><td width="30%">施工組</td><td width="20%">稽核日期</td><td width="30%">${dateStr}</td></tr>
                    <tr><td>要項敘述</td><td colspan="3">${stmtScope}</td></tr>
                    <tr style="background-color: #f3f4f6; text-align: center; font-weight: bold;">
                        <td width="5%">項次</td><td width="35%">稽核細項</td><td width="15%">稽核結果</td><td width="45%">事實陳述</td>
                    </tr>
                    <tr><td style="text-align: center;">1</td><td>檢查位置是否正確?</td><td style="text-align: center;">○符合</td><td>經系統解析，位於南港區之基地位置皆與圖說相符。</td></tr>
                    <tr><td style="text-align: center;">2</td><td>檢查日期是否正確?</td><td style="text-align: center;">○符合</td><td>表單日期與日誌登載一致。</td></tr>
                    <tr><td style="text-align: center;">3</td><td>檢查時機是否合宜?</td><td style="text-align: center;">○符合</td><td>施工前中後自檢時機符合規範。</td></tr>
                    <tr><td style="text-align: center;">4</td><td>檢查結果是否正確?</td><td style="text-align: center;">○符合</td><td>各項查核結果皆正確。</td></tr>

        // 一鍵匯出 Word 報表
        function exportToWord() {
            const reportContent = document.getElementById('report-content').innerHTML;
            const htmlStructure = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head>

                        @page { size: A4 portrait; margin: 2cm; }
                        table { border-collapse: collapse; width: 100%; margin-bottom: 20px; font-size: 14px; }
                        th, td { border: 1px solid black; padding: 8px; }
                        .page-break { page-break-before: always; }
                        h2, h3 { text-align: center; margin: 5px 0; }
                    </style>
                </head>
                <body>
                    ${reportContent}
                </body>
                </html>
            `;
            
            const blob = new Blob(['\ufeff', htmlStructure], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = '豐譽營造_內部品質稽核成果報告_V5終極版.doc';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            
            showToast('Word 文件已成功下載！', 'success');
        }
