<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豐譽營造 - 智慧品管稽核系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #e2e8f0; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        .upload-zone { border: 2px dashed #94a3b8; transition: all 0.3s ease; background-color: #f8fafc; }
        .upload-zone:hover { border-color: #2563eb; background-color: #eff6ff; }
        .spinner { border: 4px solid rgba(37, 99, 235, 0.1); width: 48px; height: 48px; border-radius: 50%; border-left-color: #2563eb; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* 📄 A4 紙張預覽樣式 */
        .a4-paper {
            background: white;
            max-width: 21cm;
            min-height: 29.7cm;
            margin: 0 auto;
            padding: 2cm 1.5cm;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            color: #000;
            line-height: 1.6;
        }
        .a4-paper h1 { font-size: 18pt; text-align: center; font-weight: bold; margin-bottom: 5px; }
        .a4-paper h2 { font-size: 16pt; text-align: center; font-weight: bold; margin-bottom: 20px; }
        .a4-paper h3 { font-size: 14pt; font-weight: bold; margin-top: 25px; margin-bottom: 10px; border-bottom: 2px solid #000; padding-bottom: 5px;}
        .a4-paper p { font-size: 12pt; text-align: justify; margin-bottom: 10px; }
        
        /* 表格樣式 */
        .report-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 11pt; }
        .report-table th, .report-table td { border: 1px solid #000; padding: 8px; vertical-align: top; }
        .report-table th { background-color: #f2f2f2; font-weight: bold; text-align: left; }
        .report-table .text-center { text-align: center; }
        .indent-list { padding-left: 20px; margin-bottom: 10px; }
        .indent-list li { list-style-type: decimal; margin-bottom: 5px; }
        
        /* 自訂捲軸 */
        ::-webkit-scrollbar { width: 6px; height: 6px;}
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <header class="bg-slate-800 text-white shadow-md z-10 flex-shrink-0 relative">
        <div class="max-w-screen-2xl mx-auto px-6 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-layer-group text-2xl text-blue-400"></i>
                <h1 class="text-xl font-bold tracking-wider">豐譽營造 <span class="text-slate-400 mx-2">|</span> 內部稽核自動化公文系統 <span class="text-xs bg-blue-600 px-2 py-0.5 rounded ml-2">V2.0 GitHub版</span></h1>
            </div>
            <div class="text-sm bg-slate-700 text-slate-200 px-3 py-1 rounded-full border border-slate-600">
                <i class="fa-brands fa-github mr-1"></i> 雲端前端渲染引擎
            </div>
        </div>
    </header>

    <main class="flex-grow flex overflow-hidden max-w-screen-2xl mx-auto w-full p-4 gap-4">
        
        <!-- Left Column: Settings & Upload -->
        <div class="w-80 flex flex-col gap-4 overflow-y-auto pr-2 flex-shrink-0 pb-10">
            <div class="glass-panel p-5 rounded-xl border-t-4 border-t-blue-600 flex flex-col">
                
                <!-- Role Selection -->
                <h2 class="text-sm font-bold mb-3 text-slate-800 border-b pb-2"><i class="fa-solid fa-users-gear mr-1 text-slate-500"></i> 稽核視角設定 (多選)</h2>
                <div class="flex flex-col gap-2 mb-6">
                    <label class="flex items-center space-x-2 cursor-pointer group">
                        <input type="checkbox" id="role-engineer" class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500" checked>
                        <span class="text-sm text-slate-700 group-hover:text-blue-600 font-medium">現場工程師 <span class="text-xs text-slate-400 font-normal">(著重執行與實務)</span></span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer group">
                        <input type="checkbox" id="role-qa" class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500" checked>
                        <span class="text-sm text-slate-700 group-hover:text-blue-600 font-medium">品管工程師 <span class="text-xs text-slate-400 font-normal">(著重規範與溯源)</span></span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer group">
                        <input type="checkbox" id="role-director" class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500" checked>
                        <span class="text-sm text-slate-700 group-hover:text-blue-600 font-medium">工地主任 <span class="text-xs text-slate-400 font-normal">(著重管理與整合)</span></span>
                    </label>
                </div>

                <h2 class="text-sm font-bold mb-3 text-slate-800 border-b pb-2"><i class="fa-solid fa-cloud-arrow-up mr-1 text-slate-500"></i> 資料匯入區</h2>
                
                <div class="mb-4 relative z-10">
                    <label class="block text-xs font-bold text-slate-600 mb-1">施工日誌 (當月)</label>
                    <div class="upload-zone rounded-lg p-3 text-center relative" id="drop-log">
                        <i class="fa-regular fa-calendar-check text-xl text-slate-400 mb-1 pointer-events-none"></i>
                        <p class="text-[11px] text-slate-500 pointer-events-none">點擊或拖曳檔案</p>
                        <input type="file" id="file-log" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    </div>
                    <div id="list-log" class="mt-2 space-y-1 max-h-32 overflow-y-auto"></div>
                </div>

                <div class="mb-4 relative z-10">
                    <label class="block text-xs font-bold text-slate-600 mb-1">月會簡報</label>
                    <div class="upload-zone rounded-lg p-3 text-center relative" id="drop-ppt">
                        <i class="fa-solid fa-chart-pie text-xl text-slate-400 mb-1 pointer-events-none"></i>
                        <p class="text-[11px] text-slate-500 pointer-events-none">點擊或拖曳檔案</p>
                        <input type="file" id="file-ppt" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    </div>
                    <div id="list-ppt" class="mt-2 space-y-1 max-h-32 overflow-y-auto"></div>
                </div>

                <div class="mb-6 relative z-10 flex-grow">
                    <label class="block text-xs font-bold text-slate-600 mb-1">自主檢查表 (批量)</label>
                    <div class="upload-zone rounded-lg p-4 text-center relative bg-amber-50/50 border-amber-200 hover:border-amber-400 hover:bg-amber-50" id="drop-check">
                        <i class="fa-solid fa-clipboard-list text-2xl text-amber-500 mb-2 pointer-events-none"></i>
                        <p class="text-[11px] text-slate-500 pointer-events-none">支援拖曳多份表單<br>AI 智慧檔名解析</p>
                        <input type="file" id="file-check" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    </div>
                    <div id="list-check" class="mt-2 space-y-1 max-h-40 overflow-y-auto border-t border-slate-100 pt-1"></div>
                </div>

                <button id="btn-analyze" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 px-4 rounded-lg transition-colors flex items-center justify-center shadow-md border border-slate-600">
                    <i class="fa-solid fa-microchip mr-2 text-blue-400"></i> 啟動多視角智慧稽核
                </button>
            </div>
        </div>

        <!-- Right Column: Document Preview -->
        <div class="flex-grow bg-slate-300 rounded-xl overflow-y-auto relative border border-slate-400 shadow-inner flex flex-col">
            
            <!-- Tools Bar -->
            <div class="bg-slate-100 p-2 border-b border-slate-300 flex justify-between items-center sticky top-0 z-10 shadow-sm">
                <span class="text-sm font-bold text-slate-600 ml-2"><i class="fa-regular fa-file-word mr-1"></i> 綜合稽核產出預覽 (A4)</span>
                <button id="btn-download" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded text-sm font-medium transition-colors hidden shadow-sm flex items-center">
                    <i class="fa-solid fa-file-arrow-down mr-2"></i> 一鍵匯出 Word 報表
                </button>
            </div>

            <!-- Loading Overlay -->
            <div id="loading" class="absolute inset-0 bg-slate-200/95 z-20 hidden flex-col items-center justify-center backdrop-blur-sm">
                <div class="spinner mb-4"></div>
                <h3 class="text-lg font-bold text-slate-800">AI 多視角大數據運算中...</h3>
                <p id="loading-text" class="text-sm text-slate-600 mt-2 text-center font-medium">正在載入系統模組...</p>
                <div class="w-64 bg-slate-300 rounded-full h-2 mt-4 overflow-hidden shadow-inner">
                    <div id="loading-progress" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <!-- Document Container -->
            <div class="p-6 pb-20">
                <div id="empty-state" class="flex flex-col items-center justify-center h-full text-slate-400 mt-32">
                    <i class="fa-solid fa-file-shield text-6xl mb-4 text-slate-300"></i>
                    <p class="font-medium text-slate-500">請設定角色視角並匯入資料以生成報告</p>
                </div>
                <div id="report-content" class="a4-paper hidden"></div>
            </div>
        </div>
    </main>

    <script>
        const files = { log: [], ppt: [], check: [] };
        
        // 檔案上傳與列表渲染邏輯
        function setupInput(type) {
            document.getElementById(`file-${type}`).addEventListener('change', (e) => {
                const newFiles = Array.from(e.target.files).map(f => ({ file: f, selected: true }));
                files[type].push(...newFiles);
                renderList(type);
                e.target.value = ''; // 清空 input 允許重複選擇
            });
        }

        function renderList(type) {
            const list = document.getElementById(`list-${type}`);
            list.innerHTML = '';
            files[type].forEach((item, i) => {
                list.innerHTML += `
                <div class="text-[11px] text-left bg-white border p-1.5 px-2 rounded flex justify-between items-center mb-1 shadow-sm transition-colors duration-200 ${item.selected ? 'border-blue-300' : 'border-slate-200 bg-slate-50 opacity-60'} relative z-20">
                    <div class="flex items-center truncate mr-2 w-full cursor-pointer" onclick="toggleFile('${type}', ${i})">
                        <input type="checkbox" ${item.selected ? 'checked' : ''} class="mr-2 pointer-events-none w-3.5 h-3.5 text-blue-600 rounded border-gray-300">
                        <span class="truncate ${item.selected ? 'text-blue-700 font-medium' : 'text-slate-400'}">
                            <i class="fa-solid fa-file-pdf ${item.selected ? 'text-red-500' : 'text-slate-400'} mr-1.5"></i>${item.file.name}
                        </span>
                    </div>
                    <button onclick="removeFile('${type}', ${i})" class="text-slate-400 hover:text-red-500 ml-2 px-1 transition-colors z-30" title="刪除檔案">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>`;
            });
        }

        window.toggleFile = (type, i) => { files[type][i].selected = !files[type][i].selected; renderList(type); };
        window.removeFile = (type, i) => { files[type].splice(i, 1); renderList(type); };

        setupInput('log'); setupInput('ppt'); setupInput('check');

        document.getElementById('btn-download').addEventListener('click', function() {
            // 定義 Word 專用的 HTML 標頭，強制設定 A4 紙張、邊界與標準字體
            const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' " +
                "xmlns:w='urn:schemas-microsoft-com:office:word' " +
                "xmlns='http://www.w3.org/TR/REC-html40'>" +
                "<head><meta charset='utf-8'><title>內部品質稽核成果報告</title>" +
                "<style>" +
                "body { font-family: '標楷體', 'MingLiU', serif; }" + // 預設使用標楷體
                "table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 11pt; }" +
                "th, td { border: 1px solid #000000; padding: 8px; vertical-align: top; text-align: left; }" +
                "th { background-color: #f2f2f2; font-weight: bold; }" +
                "h1 { font-size: 18pt; text-align: center; font-weight: bold; margin-bottom: 10px; }" +
                "h2 { font-size: 16pt; text-align: center; font-weight: bold; margin-bottom: 20px; }" +
                "h3 { font-size: 14pt; font-weight: bold; border-bottom: 1px solid #000; padding-bottom: 5px; margin-top: 20px; }" +
                "p, li { font-size: 12pt; line-height: 1.5; }" +
                ".text-center { text-align: center !important; }" +
                /* 強制設定 Word 版面為 A4 尺寸及邊界 */
                "@page WordSection1 { size: 21cm 29.7cm; margin: 2cm 1.5cm; mso-paper-source: 0; }" +
                "div.WordSection1 { page: WordSection1; }" +
                "</style></head><body><div class='WordSection1'>";
            const footer = "</div></body></html>";
            
            // 抓取畫面上已經渲染好的報告內容
            const content = document.getElementById('report-content').innerHTML;
            const html = header + content + footer;

            // 轉換為 Blob 物件並觸發下載
            const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = '豐譽營造_內部品質稽核成果報告.doc';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            // UI 按鈕回饋
            const originalText = this.innerHTML;
            this.innerHTML = '<i class="fa-solid fa-check text-white mr-2"></i> 下載成功';
            this.classList.replace('bg-indigo-600', 'bg-emerald-600');
            this.classList.replace('hover:bg-indigo-700', 'hover:bg-emerald-700');
            
            setTimeout(() => { 
                this.innerHTML = originalText; 
                this.classList.replace('bg-emerald-600', 'bg-indigo-600');
                this.classList.replace('hover:bg-emerald-700', 'hover:bg-indigo-700');
            }, 3000);
        });

        document.getElementById('btn-analyze').addEventListener('click', () => {
            const selectedChecks = files.check.filter(item => item.selected);

            if (selectedChecks.length === 0) {
                alert('⚠️ 系統提示：請至少上傳並「勾選」一份「自主檢查表」進行比對分析！');
                return;
            }

            // 獲取選擇的角色視角
            const roles = {
                engineer: document.getElementById('role-engineer').checked,
                qa: document.getElementById('role-qa').checked,
                director: document.getElementById('role-director').checked
            };
            
            if(!roles.engineer && !roles.qa && !roles.director){
                alert('⚠️ 系統提示：請至少選擇一種稽核視角！');
                return;
            }

            // UI 狀態切換
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('loading').classList.add('flex');
            document.getElementById('report-content').classList.add('hidden');
            document.getElementById('btn-download').classList.add('hidden');

            const loadingText = document.getElementById('loading-text');
            const loadingProgress = document.getElementById('loading-progress');
            
            let currentFileIndex = 0;
            let dynamicForm6Data = [];

            // 智慧檔名解析引擎
            const parseFileName = (filename) => {
                let dateStr = "115.07.未標示";
                const dateMatch = filename.match(/115\d{4}/);
                if (dateMatch) {
                    const d = dateMatch[0];
                    dateStr = `${d.substring(0,3)}.${d.substring(3,5)}.${d.substring(5,7)}`;
                }

                const formMatch = filename.match(/EA\d+-\d+/i);
                const formNo = formMatch ? formMatch[0].toUpperCase() : "現場專案抽查";

                let baseName = filename.replace(/\.[^/.]+$/, "");
                if(formMatch) baseName = baseName.replace(formMatch[0], "");
                if(dateMatch) baseName = baseName.replace(dateMatch[0], "");
                baseName = baseName.replace(/^[_\-\s()]+|[_\-\s()]+$/g, '').trim();
                
                // 智慧工程語意擴充
                let prefix = "【現場查驗】";
                let details = " (依品質計畫書辦理現場查證)";
                let mockResult = "☑ 已確實量測";
                
                if (baseName.includes("中間樁") || baseName.includes("支撐")) {
                    prefix = "【擋土支撐工程】";
                    details = " (查證引孔、型鋼下放、根固灌漿等品質及定位誤差)";
                } else if (baseName.includes("預壘樁") || baseName.includes("排樁")) {
                    prefix = "【擋土排樁工程】";
                    if(baseName.includes("放樣")) { details = " (查核樁心座標定位與容許誤差 ±3cm 內)"; mockResult = "實測誤差 1.5cm 內"; }
                    else if(baseName.includes("鑽掘")) { details = " (查核垂直度 ≦1/200、鑽掘深度及入岩判定)"; mockResult = "實測垂直度 1.1°"; }
                    else if(baseName.includes("鋼筋")) { details = " (查核主筋支數、箍筋間距及搭接長度 ≧199cm)"; mockResult = "實測搭接達 200cm"; }
                } else if (baseName.includes("CCP") || baseName.includes("止水")) {
                    prefix = "【地質改良與止水工程】";
                    details = " (查核水灰比 W/C=1:1、注漿壓力 ≧180kgf/cm2 及垂直度)";
                    mockResult = "實測壓力 180kgf/cm2";
                }

                let formattedItem = `<span class="font-bold text-slate-800">${prefix}</span> ${baseName || '現場施工自主檢查'}<br><span class="text-[11px] text-slate-600 font-medium">${details}</span>`;

                return { date: dateStr, no: formNo, item: formattedItem, fix: mockResult, shortName: baseName || '現場自主檢查' };
            };

            const processFile = () => {
                if (currentFileIndex < selectedChecks.length) {
                    const file = selectedChecks[currentFileIndex].file;
                    
                    loadingText.innerHTML = `正在多維度解析第 ${currentFileIndex + 1}/${selectedChecks.length} 份表單...<br><span class="text-xs text-blue-600">${file.name}</span>`;
                    loadingProgress.style.width = `${((currentFileIndex + 1) / selectedChecks.length) * 100}%`;

                    // 調用智慧解析引擎
                    const parsedData = parseFileName(file.name);
                    dynamicForm6Data.push({
                        date: parsedData.date,
                        no: parsedData.no,
                        item: parsedData.item,
                        shortItem: parsedData.shortName,
                        result: "☑ 已勾選",
                        fix: parsedData.fix
                    });

                    currentFileIndex++;
                    setTimeout(processFile, 400); // 加快模擬解析速度
                } else {
                    loadingText.innerHTML = "解析完成！正在生成多視角公文排版...";
                    setTimeout(() => {
                        renderReport({ form6: dynamicForm6Data, roles: roles });
                        document.getElementById('loading').classList.add('hidden');
                        document.getElementById('loading').classList.remove('flex');
                        document.getElementById('report-content').classList.remove('hidden');
                        document.getElementById('btn-download').classList.remove('hidden');
                    }, 800);
                }
            };

            processFile();
        });

        function renderReport(data) {
            // 動態生成各視角的建議與結論
            let dynamicInsights = "";
            let roleBadges = [];
            
            if (data.roles.engineer) {
                roleBadges.push("現場工程師");
                dynamicInsights += `1. 【現場執行與實務面】：\n　 本月實體地工工程（排樁與CCP）推進順利，鑽機與重機具動線調度得宜。遇颱風或雷雨等天候均即時啟動抽水及防護設備。後續將持續加強現場工班之勤前教育，確保每一支樁之鑽掘深度、垂直度均由現場工程師持儀器實測，落實按圖施工精準度。\n\n`;
            }
            if (data.roles.qa) {
                roleBadges.push("品管工程師");
                dynamicInsights += `2. 【系統品質與溯源面】：\n　 各項大宗材料（鋼筋、晉瑜水泥、宥辰機制砂）進場檢驗與試體查驗均按檢驗停留點（Hold Point）確實執行。自主檢查表嚴禁「萬年打勾」，本月抽驗之表單其量化數據（如：垂直度0.1°、放樣誤差1.5cm）皆填寫完整並歸檔，有效達成源頭防弊與品質追溯。\n\n`;
            }
            if (data.roles.director) {
                    <tr><td class="text-center">17</td><td>工程師是否確實了解執行工作的標準</td><td class="text-center font-bold text-emerald-600">O</td><td>抽訪現場工程師及工班，均能確實敘述預壘樁入岩及灌漿間隔不得超過3分鐘之標準。</td></tr>
                    <tr><td class="text-center">18</td><td>工作成果是否符合作業紀錄</td><td class="text-center font-bold text-emerald-600">O</td><td>完成之預壘樁及連續場鑄排樁數量與進度回報、施工日誌及實作米數一致。</td></tr>
                </table>

                <h3>三、 表 10.5-3 內部品質稽核報告表</h3>
                <table class="report-table">
                    <tr><th width="15%">稽核類型</th><td width="35%">文件與現場稽核</td><th width="15%">稽核單位</th><td width="35%">品管組</td></tr>
